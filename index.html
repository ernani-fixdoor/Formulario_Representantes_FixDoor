<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FixDoor — Solicitação de Orçamentos para Representantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
  <img src="img/logo-fixdoor.png" alt="FixDoor" class="logo" id="logo-fixdoor">
  <h1>Formulário de Solicitação de Orçamentos para Representantes FixDoor</h1>
</header>

<!-- Portão de senha -->
<section id="gate" class="cartao">
  <label for="senha">Senha do representante</label>
  <input type="password" id="senha" autocomplete="off" placeholder="Digite sua senha">
  <button id="btn-entrar" type="button">Entrar<span class="spinner" hidden></span></button>
  <p id="gate-erro" class="erro" hidden>Senha incorreta. Tente de novo.</p>
</section>

<!-- Formulário (fica escondido até a senha ser validada) -->
<form id="formulario" class="cartao" hidden>
  <p class="representante-atual">Representante: <strong id="nome-representante"></strong></p>
  <input type="hidden" id="representante" name="representante">

  <fieldset>
    <legend>Dados do cliente</legend>

    <label for="nome_cliente">Nome do cliente</label>
    <input type="text" id="nome_cliente" name="nome_cliente" required>

    <label for="cnpj_cliente">CNPJ do cliente</label>
    <input type="text" id="cnpj_cliente" name="cnpj_cliente" inputmode="numeric"
           placeholder="00.000.000/0000-00" maxlength="18"
           pattern="\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}"
           title="Digite os 14 números do CNPJ" required>

    <label for="inscricao_estadual">Inscrição Estadual</label>
    <select id="inscricao_estadual" name="inscricao_estadual" required>
      <option value="" selected disabled>Selecione...</option>
      <option value="Sim">Sim</option>
      <option value="Não">Não</option>
    </select>

    <label for="destinacao_fiscal">Destinação fiscal do equipamento</label>
    <select id="destinacao_fiscal" name="destinacao_fiscal" required>
      <option value="" selected disabled>Selecione...</option>
      <option value="Uso e consumo">Uso e consumo</option>
      <option value="Ativo imobilizado">Ativo imobilizado</option>
      <option value="Revenda">Revenda</option>
    </select>

    <label for="email_cliente">E-mail do cliente</label>
    <input type="email" id="email_cliente" name="email_cliente" required>

    <label for="telefone_cliente">Telefone do cliente</label>
    <input type="text" id="telefone_cliente" name="telefone_cliente" inputmode="numeric"
           placeholder="(00) 00000-0000" maxlength="16"
           pattern="\(\d{2}\) \d{4,5}-\d{4}"
           title="Digite um telefone válido com DDD" required>

    <label for="estado">Estado</label>
    <select id="estado" name="estado" required>
      <option value="" selected disabled>Carregando estados...</option>
    </select>

    <label for="cidade">Cidade</label>
    <select id="cidade" name="cidade" required disabled>
      <option value="" selected disabled>Selecione o estado primeiro</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>Frete</legend>
    <label for="frete">Frete</label>
    <select id="frete" name="frete" required>
      <option value="" selected disabled>Selecione...</option>
      <option value="CIF">CIF</option>
      <option value="FOB">FOB</option>
      <option value="FOB com indicação">FOB com indicação</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>Instalação</legend>
    <label for="instalacao">Instalação</label>
    <select id="instalacao" name="instalacao" required>
      <option value="" selected disabled>Selecione...</option>
      <option value="Não">Não</option>
      <option value="Pelo representante">Pelo representante</option>
      <option value="Por equipe credenciada pela FixDoor">Por equipe credenciada pela FixDoor</option>
    </select>

    <div id="campo-valor-instalacao" hidden>
      <label for="valor_instalacao">Valor da instalação por equipamento</label>
      <input type="text" id="valor_instalacao" name="valor_instalacao" inputmode="numeric" placeholder="R$ 0,00">
    </div>
  </fieldset>

  <!-- Um ou mais equipamentos (Porta Seccional / Portal de Selamento) no mesmo orçamento.
       Os blocos de item são gerados dinamicamente pelo js/app.js (criarBlocoItem). -->
  <div id="itens-equipamento"></div>
  <button type="button" id="btn-add-item" class="btn-secundario">+ Adicionar outro equipamento</button>

  <label for="anexos">Anexos</label>
  <input type="file" id="anexos" multiple accept="image/*,video/*">
  <ul id="lista-anexos" class="lista-anexos"></ul>
  <p class="dica">Pode selecionar mais de um arquivo, de uma vez ou aos poucos.</p>

  <button type="submit" id="btn-enviar">Enviar solicitação<span class="spinner" hidden></span></button>
  <p id="form-status" hidden></p>
  <button type="button" id="btn-nova-solicitacao" class="btn-secundario" hidden>Nova solicitação</button>
</form>

<script src="js/app.js"></script>
</body>
</html>
